app:
  services:
    ingestion:
      url: ${INGESTION_SERVICE_URL:http://localhost:8000}
      timeout: ${INGESTION_SERVICE_TIMEOUT:30s}

resilience4j:
  circuitbreaker:
    instances:
      ingestion-service:
        register-health-indicator: true
        sliding-window-size: 10             # View the last 10 calls
        minimum-number-of-calls: 5          # At least 5 calls before deciding
        permitted-number-of-calls-in-half-open-state: 3
        automatic-transition-from-open-to-half-open-enabled: true
        wait-duration-in-open-state: 10s    # If the circuit opens, wait 10 seconds before trying again (Half-Open)
        failure-rate-threshold: 50          # If 50% fails, open the circuit
        event-consumer-buffer-size: 10
  retry:
    instances:
      ingestion-service:
        max-attempts: 3
        wait-duration: 2s
        enableExponentialBackoff: true
        exponentialBackoffMultiplier: 2