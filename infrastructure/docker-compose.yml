services:

  postgres:
    image: postgres:18-alpine
    container_name: tg-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - tg-network
    # Healthcheck ensures the DB is ready before the Orchestrator starts
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M

  db-migrations:
    image: flyway/flyway:12-alpine
    command: migrate
    environment:
      FLYWAY_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB}
      FLYWAY_USER: ${POSTGRES_USER}
      FLYWAY_PASSWORD: ${POSTGRES_PASSWORD}
      FLYWAY_PLACEHOLDERS_MS_ORCHESTRATOR_USER: ${MS_ORCHESTRATOR_USER}
      FLYWAY_PLACEHOLDERS_MS_POLICY_ENGINE_USER: ${MS_POLICY_ENGINE_USER}
      FLYWAY_PLACEHOLDERS_MS_ORCHESTRATOR_PASSWORD: ${MS_ORCHESTRATOR_PASSWORD}
      FLYWAY_PLACEHOLDERS_MS_POLICY_ENGINE_PASSWORD: ${MS_POLICY_ENGINE_PASSWORD}
    volumes:
      - ./db/migrations:/flyway/sql
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - tg-network

  qdrant:
    image: qdrant/qdrant:v1.13.6
    container_name: tg-qdrant
    restart: unless-stopped
    ports:
      - "${QDRANT_PORT}:6333"   # AMQP protocol port
      - "6334:6334"             # Management UI (http://localhost:15672)
    configs:
      - source: qdrant_config
    volumes:
      - qdrant_data:/qdrant/storage
    networks:
      - tg-network
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 512M

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: tg-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD}
    ports:
      - "${RABBITMQ_PORT}:5672"       # HTTP API (Used by Spring AI)
      - "${RABBITMQ_UI_PORT}:15672"   # gRPC API
    networks:
      - tg-network
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 30s
      timeout: 30s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          memory: 128M

networks:
  tg-network:
    driver: bridge

volumes:
  postgres_data:
  qdrant_data:

configs:
  qdrant_config:
    content: |
      log_level: INFO