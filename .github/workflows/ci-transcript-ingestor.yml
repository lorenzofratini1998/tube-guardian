name: CI - Transcript Ingestor

on:
  pull_request:
    branches: [ develop, master ]
    paths:
      - 'transcript-ingestor/**'
      - '.github/workflows/ci-transcript-ingestor.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./transcript-ingestor
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.14'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Tests
        run: PYTHONPATH=. pytest