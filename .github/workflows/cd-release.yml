name: CD - Release to DockerHub

on:
  push:
    branches:
      - master

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    strategy:
      matrix:
        include:
          - module: tg-video-orchestrator
            context: ./tubeguardian-bom
            dockerfile: ./tubeguardian-bom/tg-video-orchestrator/Dockerfile

          - module: tg-policy-engine
            context: ./tubeguardian-bom
            dockerfile: ./tubeguardian-bom/tg-policy-engine/Dockerfile

          - module: transcript-ingestor
            context: ./transcript-ingestor
            dockerfile: ./transcript-ingestor/Dockerfile

          - module: tubeguardian-ui
            context: ./tubeguardian-ui
            dockerfile: ./tubeguardian-ui/Dockerfile

    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Get version from pom.xml
        run: |
          VERSION=$(grep -m 1 -oP '(?<=<version>)[^<]+' tubeguardian-bom/pom.xml)
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Building version: $VERSION"

      - name: Build and Push to DockerHub
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.dockerfile }}
          push: true
          tags: |
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.module }}:latest
            ${{ secrets.DOCKER_USERNAME }}/${{ matrix.module }}:${{ env.APP_VERSION }}