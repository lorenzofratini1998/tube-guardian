name: CI - Policy Engine
on:
  pull_request:
    branches: [ develop, master ]
    paths:
      - 'tubeguardian-bom/tg-policy-engine/**'
      - 'tubeguardian-bom/tg-common/**'
      - 'tubeguardian-bom/pom.xml'
      - '.github/workflows/ci-policy-engine.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25
          cache: maven

      - name: Build and Run Tests
        run: mvn -B -f tubeguardian-bom/pom.xml -pl tg-policy-engine -am clean install